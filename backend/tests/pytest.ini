[pytest]

# Test file matching patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support - auto mode for pytest-asyncio
# Note: asyncio_mode requires pytest-asyncio >= 0.21
asyncio_mode = auto

# Test marker definitions
markers =
    asyncio: Async tests - Run with pytest-asyncio
    unit: Unit tests - Fast execution, no external dependencies
    integration: Integration tests - Test real HTTP requests
    basic: Basic functionality tests
    imports: Module import tests
    image_service: Image service related tests
    cos_storage: COS storage related tests
    image_endpoints: Image API related tests
    id_generator: ID generator related tests
    layout_optimization: Layout optimization related tests
    html_parser: HTML parser related tests
    auth: Authentication and authorization related tests

# Test output configuration
addopts = -v --tb=short

# Coverage configuration (optional)
# --cov=app
# --cov-report=term-missing
# --cov-report=html:reports/coverage
